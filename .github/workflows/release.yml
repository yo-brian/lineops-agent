name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional custom tag (leave empty to auto-increment from latest tag)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Resolve or auto-increment version and tag
        id: meta
        run: |
          git fetch --tags --force
          if [[ "${{ github.event_name }}" == "push" && "${GITHUB_REF}" == refs/tags/* ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            RAW_TAG="${{ inputs.tag }}"
          else
            # Find the latest version tag sorted by version
            LATEST_TAG=$(git tag -l | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1 || true)
            if [[ -z "$LATEST_TAG" ]]; then
              RAW_TAG="v0.10.14-dev"
            elif [[ "$LATEST_TAG" =~ ^(v?[0-9]+\.[0-9]+\.)([0-9]+)(.*)$ ]]; then
              PREFIX="${BASH_REMATCH[1]}"
              PATCH="${BASH_REMATCH[2]}"
              SUFFIX="${BASH_REMATCH[3]}"
              NEXT_PATCH=$((PATCH + 1))
              RAW_TAG="${PREFIX}${NEXT_PATCH}${SUFFIX}"
            else
              RAW_TAG="v0.10.14-dev"
            fi

            # Create and push the new tag if it does not exist yet
            if ! git rev-parse "$RAW_TAG" >/dev/null 2>&1; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag "$RAW_TAG"
              git push origin "$RAW_TAG"
            fi
          fi

          VERSION="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${RAW_TAG} (version: ${VERSION})"

      - name: Build Linux binaries (amd64 & arm64)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          bash scripts/build.sh
          go mod download github.com/sagernet/sing-box@v1.14.0
          SB_SRC=$(go list -m -f '{{.Dir}}' github.com/sagernet/sing-box@v1.14.0)
          for arch in amd64 arm64; do
            (cd "$SB_SRC" && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -mod=readonly -buildvcs=false -trimpath \
              -tags with_quic,with_utls,with_clash_api,with_v2ray_api \
              -ldflags '-s -w -X github.com/sagernet/sing-box/constant.Version=1.14.0' \
              -o "$GITHUB_WORKSPACE/bin/lineops-singbox-linux-$arch" ./cmd/sing-box)
          done
          cp scripts/install.sh bin/install.sh
          (cd bin && sha256sum lineops-agent-linux-amd64 lineops-agent-linux-arm64 lineops-singbox-linux-amd64 lineops-singbox-linux-arm64 install.sh > SHA256SUMS)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            bin/lineops-agent-linux-amd64
            bin/lineops-agent-linux-arm64
            bin/lineops-singbox-linux-amd64
            bin/lineops-singbox-linux-arm64
            bin/install.sh
            bin/SHA256SUMS
