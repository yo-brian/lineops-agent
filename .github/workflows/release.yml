name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional custom tag (leave empty to auto-increment from latest tag)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Resolve or auto-increment version and tag
        id: meta
        run: |
          git fetch --tags --force
          if [[ "${{ github.event_name }}" == "push" && "${GITHUB_REF}" == refs/tags/* ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            RAW_TAG="${{ inputs.tag }}"
          else
            # Find the latest version tag sorted by version
            LATEST_TAG=$(git tag -l | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1 || true)
            if [[ -z "$LATEST_TAG" ]]; then
              RAW_TAG="v0.10.16-dev"
            elif [[ "$LATEST_TAG" =~ ^(v?[0-9]+\.[0-9]+\.)([0-9]+)(.*)$ ]]; then
              PREFIX="${BASH_REMATCH[1]}"
              PATCH="${BASH_REMATCH[2]}"
              SUFFIX="${BASH_REMATCH[3]}"
              NEXT_PATCH=$((PATCH + 1))
              RAW_TAG="${PREFIX}${NEXT_PATCH}${SUFFIX}"
            else
              RAW_TAG="v0.10.16-dev"
            fi

            # Create and push the new tag if it does not exist yet
            if ! git rev-parse "$RAW_TAG" >/dev/null 2>&1; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag "$RAW_TAG"
              git push origin "$RAW_TAG"
            fi
          fi

          VERSION="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${RAW_TAG} (version: ${VERSION})"

      - name: Build Linux & macOS binaries (amd64 & arm64)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          bash scripts/build.sh
          for sb_ver in 1.14.4 1.14.3 1.14.2 1.14.1 1.14.0; do
            go mod download "github.com/sagernet/sing-box@v${sb_ver}"
            SB_SRC=$(go list -m -f '{{.Dir}}' "github.com/sagernet/sing-box@v${sb_ver}")
            for os in linux darwin; do
              for arch in amd64 arm64; do
                (cd "$SB_SRC" && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -mod=readonly -buildvcs=false -trimpath \
                  -tags with_quic,with_utls,with_clash_api,with_v2ray_api \
                  -ldflags "-s -w -X github.com/sagernet/sing-box/constant.Version=${sb_ver}" \
                  -o "$GITHUB_WORKSPACE/bin/lineops-singbox-${sb_ver}-${os}-${arch}" ./cmd/sing-box)
              done
            done
          done
          for os in linux darwin; do
            for arch in amd64 arm64; do
              cp "$GITHUB_WORKSPACE/bin/lineops-singbox-1.14.4-${os}-${arch}" "$GITHUB_WORKSPACE/bin/lineops-singbox-${os}-${arch}"
              curl -fsSL "https://github.com/fatedier/frp/releases/download/v0.61.1/frp_0.61.1_${os}_${arch}.tar.gz" -o "/tmp/frp_${os}_${arch}.tar.gz"
              tar -xzf "/tmp/frp_${os}_${arch}.tar.gz" -C /tmp
              install -m 0755 "/tmp/frp_0.61.1_${os}_${arch}/frps" "$GITHUB_WORKSPACE/bin/lineops-frps-${os}-${arch}"
              install -m 0755 "/tmp/frp_0.61.1_${os}_${arch}/frpc" "$GITHUB_WORKSPACE/bin/lineops-frpc-${os}-${arch}"
            done
          done
          cp scripts/install.sh bin/install.sh
          (cd bin && sha256sum lineops-agent-linux-* lineops-agent-darwin-* lineops-singbox-linux-* lineops-singbox-darwin-* lineops-singbox-*-linux-* lineops-singbox-*-darwin-* lineops-frps-* lineops-frpc-* install.sh > SHA256SUMS)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## 新增功能说明 (What's New)

            ### 1. 受管 FRP 内网穿透与端口转发 (`frps` 服务端 / `frpc` 客户端)
            - **自动下载与跨平台守护**：Agent 新增内置 FRP 生命周期管理引擎，支持在 **Linux (`systemd`)** 与 **macOS (`launchd`，含 Apple Silicon M 系列芯片)** 上按需自动下载、配置并守护 `frps`（公网中转服务端）与 `frpc`（内网穿透客户端）。
            - **双协议与断线重连**：支持 `tcp`、`udp`、`tcp+udp` 端口转发规则渲染，默认开启 `loginFailExit = false`，宽带重拨或短暂断网后自动重连。
            - **面板远程下发与心跳观测**：支持接收面板下发的 `configure_frp`、`restart_frp`、`uninstall_frp` 任务，并通过心跳实时上报 `frps` / `frpc` 运行状态与版本号（内置旧版面板滚动升级兼容回退）。
            - **终端交互菜单 (`sudo lineops`)**：新增菜单项 **`10. FRP 内网穿透管理 (frps 服务端 / frpc 客户端)`**，支持在命令行直接查看状态、一键配置、重启或卸载清理。
            - **预打包二进制产物**：Release 现已同步附带 `lineops-frps-{linux,darwin}-{amd64,arm64}` 与 `lineops-frpc-{linux,darwin}-{amd64,arm64}`（基于 FRP v0.61.1）。
          files: |
            bin/lineops-agent-linux-amd64
            bin/lineops-agent-linux-arm64
            bin/lineops-agent-darwin-arm64
            bin/lineops-agent-darwin-amd64
            bin/lineops-singbox-linux-amd64
            bin/lineops-singbox-linux-arm64
            bin/lineops-singbox-darwin-arm64
            bin/lineops-singbox-darwin-amd64
            bin/lineops-singbox-*-linux-*
            bin/lineops-singbox-*-darwin-*
            bin/lineops-frps-*
            bin/lineops-frpc-*
            bin/install.sh
            bin/SHA256SUMS
